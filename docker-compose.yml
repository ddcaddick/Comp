services:
  db:
    image: postgres:16
    container_name: comp-db
    environment:
      POSTGRES_USER: comp
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: comp_dev
    ports:
      - "5432:5432"
    volumes:
      - comp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comp -d comp_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  comp-db-data: